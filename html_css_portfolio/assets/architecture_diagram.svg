<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" style="background-color: transparent;">
    <!-- Definitions for arrow markers -->
    <defs>
        <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
            <path d="M10,0 L0,5 L10,10" fill="none" stroke="white" stroke-width="2" />
        </marker>
        <marker id="arrow-end" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10" fill="none" stroke="white" stroke-width="2" />
        </marker>
    </defs>

    <!-- Main Row Nodes -->
    <!-- Website -->
    <g transform="translate(50, 100)">
        <rect x="0" y="0" width="160" height="80" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="white" stroke-width="2" />
        <text x="80" y="35" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="sans-serif">Website</text>
        <text x="80" y="55" text-anchor="middle" fill="#cccccc" font-size="12" font-family="sans-serif">(Next.js / UI)</text>
    </g>

    <!-- Backend -->
    <g transform="translate(320, 100)">
        <rect x="0" y="0" width="160" height="80" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="white" stroke-width="2" />
        <text x="80" y="35" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="sans-serif">Flask Backend</text>
        <text x="80" y="55" text-anchor="middle" fill="#cccccc" font-size="12" font-family="sans-serif">(Orchestrator / API)</text>
    </g>

    <!-- Database -->
    <g transform="translate(590, 100)">
        <rect x="0" y="0" width="160" height="80" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="white" stroke-width="2" />
        <text x="80" y="35" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="sans-serif">Database</text>
        <text x="80" y="55" text-anchor="middle" fill="#cccccc" font-size="12" font-family="sans-serif">(PostgreSQL)</text>
    </g>

    <!-- Bottom Row Nodes (APIs) -->
    <!-- Polymarket -->
    <g transform="translate(100, 280)">
        <rect x="0" y="0" width="180" height="60" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="white" stroke-width="1.5" />
        <text x="90" y="25" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="sans-serif">Polymarket API</text>
        <text x="90" y="45" text-anchor="middle" fill="#cccccc" font-size="11" font-family="sans-serif">Real-time Market Data</text>
    </g>

    <!-- OpenRouter -->
    <g transform="translate(310, 280)">
        <rect x="0" y="0" width="180" height="60" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="white" stroke-width="1.5" />
        <text x="90" y="25" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="sans-serif">OpenRouter API</text>
        <text x="90" y="45" text-anchor="middle" fill="#cccccc" font-size="11" font-family="sans-serif">LLM Debate Generation</text>
    </g>

    <!-- ElevenLabs -->
    <g transform="translate(520, 280)">
        <rect x="0" y="0" width="180" height="60" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="white" stroke-width="1.5" />
        <text x="90" y="25" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="sans-serif">ElevenLabs API</text>
        <text x="90" y="45" text-anchor="middle" fill="#cccccc" font-size="11" font-family="sans-serif">Text-to-Speech</text>
    </g>

    <!-- Connections -->
    <!-- Website <-> Backend -->
    <line x1="210" y1="140" x2="320" y2="140" stroke="white" stroke-width="2" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />

    <!-- Backend <-> Database -->
    <line x1="480" y1="140" x2="590" y2="140" stroke="white" stroke-width="2" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />

    <!-- Backend -> Polymarket -->
    <path d="M360,180 L360,230 L190,230 L190,280" fill="none" stroke="white" stroke-width="1.5" marker-end="url(#arrow-end)" />

    <!-- Backend -> OpenRouter -->
    <path d="M400,180 L400,280" fill="none" stroke="white" stroke-width="1.5" marker-end="url(#arrow-end)" />

    <!-- Backend -> ElevenLabs -->
    <path d="M440,180 L440,230 L610,230 L610,280" fill="none" stroke="white" stroke-width="1.5" marker-end="url(#arrow-end)" />

</svg>
